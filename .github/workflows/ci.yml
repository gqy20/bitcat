name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # CI 上降低 proptest 用例数，日常足够发现回归，又不拖慢 pipeline
  PROPTEST_CASES: "64"
  # SDL2 bundled 静态编译必需：runner 上的 CMake 已移除对 < 3.5 的兼容，
  # 不设会在 sdl2-sys 的 build script 里报
  # "Compatibility with CMake < 3.5 has been removed from CMake" 而直接失败。
  # Makefile、release.yml、dev-build.yml 都已设，这里以前漏了。
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # ───── 秒级任务：fmt + clippy 独立并行，不被测试阻塞 ─────
  fmt:
    name: Rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Copy fixture configs
        run: |
          mkdir core\config
          copy config\*.yml core\config\
          mkdir app\config
          copy config\*.yml app\config\
      - name: Prepare frontend dist
        run: cargo run -p xtask -- prepare-frontend
      # --all-targets 把测试和 examples 也纳入 lint：本项目大量断言写在
      # `#[cfg(test)]` 里，不加这个 flag 时测试代码的 lint 永远不会被 CI 看到。
      # 清这一轮之前已经累积了 25 处（field_reassign_with_default ×7、
      # useless_vec ×5、assertions_on_constants ×5、needless_range_loop ×3 等）。
      # 本地等价命令（需先 rustup update stable 对齐工具链）：
      #   cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ───── 测试任务 ─────
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Copy fixture configs
        run: |
          mkdir core\config
          copy config\*.yml core\config\
          mkdir app\config
          copy config\*.yml app\config\

      - name: Prepare frontend dist
        run: cargo run -p xtask -- prepare-frontend

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (nextest)
        run: cargo nextest run --profile ci --workspace

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # ───── core 跨平台护栏：只能跑 core，app 层依赖 Win32 ─────
  #
  # 为什么需要这个 job：开发主力可以在 Linux/macOS 上（core 纯逻辑 + 前端静态页），
  # 而 windows-latest 的 job 看不见跨平台回归。已知的典型回归：
  #   - 路径处理用 std::path 导致非 Windows 主机误解远程 Windows 会话（agent_session）
  #   - shell 工具硬编码 powershell（tools::execute_shell）
  #
  # 注意：不在 Linux 上跑 clippy。app 层大量 `#[cfg(windows)]` 代码在 Linux 下
  # 会变成 dead_code，`-D warnings` 会产生误报；clippy 由上面的 Windows job 负责。
  test-linux:
    name: Test (Linux, core only)
    runs-on: ubuntu-latest
    env:
      # cargo-husky 会在 cargo test 时往 .git/hooks 写脚本，CI 里不需要
      CARGO_HUSKY_DONT_INSTALL_HOOKS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-core

      # core 测试从 crate 目录读 config/*.yml fixture
      - name: Copy fixture configs
        run: |
          mkdir -p core/config
          cp config/*.yml core/config/

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run core tests (nextest)
        run: cargo nextest run --profile ci -p bitcat-core

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-linux
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # ───── 前端单测：纯 Node，跑 ubuntu 就够（不占 Windows runner）─────
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    env:
      # 故意钉 UTC（而不是维护者本地的 Asia/Shanghai）：前端测试应该与运行环境
      # 时区无关。settings.test.js 已改成用 localRfc3339() 按本地时区构造 fixture
      # （已在 UTC / Asia-Shanghai / America-New_York / Pacific-Kiritimati 四个时区
      # 实测 187/187），钉 UTC 能在有人重新引入时区相关断言时立即报警。
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前装好，否则 cache: pnpm 无法解析
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 钉 Node 22 只为可复现，不是因为更高版本会红：Node ≥ 22 的实验性全局
          # localStorage 会遮蔽 jsdom 26.1 的 window.localStorage（实测 Node 22 容器里
          # 同样复现，不是 Node 26 独有），app/frontend/vitest.setup.js 已做兼容修补。
          # 若将来删掉 vitest.setup.js，这个 job 会在任意 Node ≥ 22 上失败。
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: app/frontend
        run: pnpm test
