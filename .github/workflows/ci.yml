name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # CI 上降低 proptest 用例数，日常足够发现回归，又不拖慢 pipeline
  PROPTEST_CASES: "64"

jobs:
  # ───── 秒级任务：fmt + clippy 独立并行，不被测试阻塞 ─────
  fmt:
    name: Rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Copy fixture configs
        run: |
          mkdir core\config
          copy config\buttons.yml core\config\
          copy config\actions.yml core\config\
          copy config\prompts.yml core\config\
          copy config\user.yml core\config\
          mkdir app\config
          copy config\buttons.yml app\config\
          copy config\actions.yml app\config\
      - run: cargo clippy --workspace -- -D warnings

  # ───── 测试任务 ─────
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Copy fixture configs
        run: |
          mkdir core\config
          copy config\buttons.yml core\config\
          copy config\actions.yml core\config\
          copy config\prompts.yml core\config\
          copy config\user.yml core\config\
          mkdir app\config
          copy config\buttons.yml app\config\
          copy config\actions.yml app\config\

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (nextest)
        run: cargo nextest run --profile ci --workspace

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
