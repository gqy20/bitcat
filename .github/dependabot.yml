version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      cargo:
        # 只归并兼容升级；0.x minor 跨越（如 rig-core 0.36→0.42、rand 0.9→0.10）
        # 属破坏性更新，单独开 PR 便于逐个评审
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
