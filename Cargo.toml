[package]
name = "ai-pad"
version = "0.1.0"
edition = "2024"

[dependencies]
sdl2 = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
chrono = { version = "0.4", features = ["default"] }
rig-core = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ai-pad-ctl"
path = "src/main.rs"

[[bin]]
name = "ai-pad-read"
path = "src/bin/read.rs"

[[bin]]
name = "rumble-test"
path = "src/bin/rumble_test.rs"
