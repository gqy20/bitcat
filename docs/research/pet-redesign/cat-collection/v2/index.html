<main>
<h1>十类猫 · 第二轮精修</h1>
<p>比较色块、眼睛和轮廓。小图按同一比例缩放并对齐脚底，睡姿保持自然高度；原始设计图保留在下方。</p>
<div class="controls">
<label>猫咪 <select id="cat"></select></label>
<label>桌面 <select id="background"><option value="light">浅色</option><option value="dark">深色</option><option value="blue">蓝色</option></select></label>
<label>预览画布 <select id="size"><option value="80">80px</option><option value="96" selected>96px</option><option value="144">144px</option></select></label>
</div>
<div class="compare">
<section class="surface"><h2>初版</h2><div id="original-poses" class="poses"></div><img id="original-sheet" alt="初版六姿势设计图"><a id="original-download" download>下载初版</a></section>
<section class="surface"><h2>精修版</h2><div id="refined-poses" class="poses"></div><img id="refined-sheet" alt="精修版六姿势设计图"><a id="refined-download" download>下载精修版</a></section>
</div>
<p id="status" role="status">正在加载…</p>
<p class="note">当前是关键帧精修稿。走路仍需补过渡帧，眨眼需固定身体像素；这里的脚底对齐仅用于比较造型，不代表动画已完成。应用中的宠物尚未替换。</p>
<details><summary>透明背景检查说明</summary><p>图片预览器可能显示透明像素中存储的隐藏颜色，看起来像光晕；这里按实际透明通道合成。十张精修图均识别出六个主体，画布外边缘没有明显不透明像素。抗锯齿和半透明细节仍需在最终像素素材阶段检查。</p></details>
