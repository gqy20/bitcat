# 弹出面板快捷入口配置
# id 需要与 app/frontend/js/panel.js 中的 ACTIONS id 保持一致。

defaults:
  terminal: powershell
  width: 480
  height: 360
  columns: 2
  rows: 2

actions:
  game:
    label: 毛线球大作战
    icon: "🎮"
    order: 10
    type: builtin
    command: game

  memory:
    label: 翻牌配对
    icon: "M"
    order: 20
    type: builtin
    command: memory

  catch:
    label: 接食物
    icon: "C"
    order: 30
    type: builtin
    command: catch

  battle:
    label: 飞机守护战
    icon: "⚔"
    order: 40
    type: builtin
    command: battle
