# 8BitDo Micro 个性化配置
# 按键动作绑定、启动参数等

defaults:
  terminal: powershell
  window: maximized   # maximized / normal / minimized

actions:
  Start:
    type: launch
    program: claude
    args: "--dangerously-skip-permissions"
    workdir: "D:\\C\\Desktop\\ai"
    terminal: true

  Y:
    type: voice
    program: claude
    workdir: "D:\\C\\Desktop\\ai\\research"
    terminal: true
    voice:
      trigger: ["ctrl", "win"]   # 触发系统语音输入法的快捷键
      delay: 1.0                  # 启动终端后等待时间（秒）

  L1:
    type: hotkey
    trigger: ["alt", "tab"]       # 切换窗口

  R1:
    type: hotkey
    trigger: ["alt", "backtick"]  # 打开 uTools

  L2:
    type: hotkey
    trigger: ["ctrl", "tab"]      # 切换浏览器/应用标签页

  R2:
    type: screenshot              # 立即截图并用 Vision 分析当前屏幕
    keyboard_shortcut: "CommandOrControl+Alt+S"
