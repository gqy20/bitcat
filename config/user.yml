# BitCat 用户配置 — 告诉 AI 你是谁
# 编译时嵌入 exe，运行时在 exe 同目录/config/ 放入同名文件可覆盖

name: ""           # 你的名字或昵称（如"小明"）
role: ""           # 职业/角色（如"全栈工程师"、"学生"）
preferences: []    # 偏好列表（如 ["中文交流", "简洁回答", "不喜欢 emoji"]）
context: ""        # 自由格式补充描述（如"正在开发 Rust 桌面应用，用 Tauri 2.0"）
language: ""       # 首选交流语言（如"zh-CN"），空则由 AI 自动判断
