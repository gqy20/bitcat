[project]
name = "gamepad"
version = "0.1.0"
description = "8BitDo Micro 手柄控制器"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.5",
    "speechrecognition>=3.16.1",
]

[project.scripts]
gamepad-read = "gamepad.reader:run"
gamepad-ctl = "gamepad.ctl:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamepad"]
