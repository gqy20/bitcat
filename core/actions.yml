# 8BitDo Micro 个性化配置
# 按键动作绑定、启动参数等

defaults:
  terminal: powershell
  window: maximized   # maximized / normal / minimized

actions:
  Start:
    type: launch
    program: claude
    args: "--dangerously-skip-permissions"
    workdir: "D:\\C\\Desktop\\ai"
    terminal: true

  Y:
    type: voice
    program: claude
    workdir: "D:\\C\\Desktop\\ai\\research"
    terminal: true
    voice:
      trigger: ["ctrl", "win"]
      delay: 1.0

  L1:
    type: hotkey
    trigger: ["alt", "tab"]

  R1:
    type: hotkey
    trigger: ["alt", "backtick"]

  L2:
    type: hotkey
    trigger: ["ctrl", "tab"]

  # ---- 面板快捷启动 ----
  vscode:
    type: launch
    program: code
    terminal: false

  browser:
    type: launch
    program: explorer
    args: "https://www.bing.com"
    terminal: false

  explorer:
    type: launch
    program: explorer.exe
    args: "."
    terminal: false

  powershell:
    type: launch
    program: powershell
    terminal: true

  notepad:
    type: launch
    program: notepad.exe
    terminal: false
