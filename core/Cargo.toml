[package]
name = "ai-pad-core"
version = "0.1.1"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
chrono = { version = "0.4", features = ["default"] }
rig-core = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
futures = "0.3"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
tracing = "0.1"
thiserror = "2"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tempfile = "3"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["yaml", "redactions"] }
rstest = "0.25"
wiremock = "0.6"
mockall = "0.13"

# Git hooks: cargo test 时自动写入 .git/hooks/pre-commit 和 pre-push
# 脚本源在 workspace 根的 .cargo-husky/hooks/。跳过安装可设 CARGO_HUSKY_DONT_INSTALL_HOOKS=true
[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
