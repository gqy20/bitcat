[package]
name = "ai-pad-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
chrono = { version = "0.4", features = ["default"] }
rig-core = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
tracing = "0.1"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
proptest = "1"
