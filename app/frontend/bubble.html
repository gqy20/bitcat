<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble</title>
  <link rel="stylesheet" href="/css/bubble.css" />
</head>
<body class="hidden">
  <div class="bubble">
    <button class="collapse-btn" id="collapseBtn" type="button" title="收起" aria-label="收起气泡">
      <span></span>
    </button>
    <div class="content idle" id="content">
      <div class="tool-status" id="toolStatus" style="display:none;"></div>
      <div class="content-body" id="contentBody"></div>
      <span class="typing-cursor" id="typingCursor" aria-hidden="true"></span>
    </div>
    <!-- 思考中指示器（流开始前显示） -->
    <div class="thinking" id="thinking" style="display:none;">
      <span></span><span></span><span></span>
    </div>
    <div class="chat-controls" id="chatControls" style="display: none;">
      <button class="control-chip stop" id="stopBtn" type="button" style="display: none;" title="停止" aria-label="停止回复">
        <span class="control-icon" aria-hidden="true">■</span><span class="control-label">停止</span>
      </button>
      <span class="control-note" id="controlNote" style="display: none;">已停止</span>
      <button class="control-chip" id="replyChip" type="button" style="display: none;" title="继续说" aria-label="继续说">
        <span class="control-icon" aria-hidden="true">+</span><span class="control-label">继续说</span>
      </button>
      <button class="control-chip" id="readChip" type="button" style="display: none;" title="展开阅读" aria-label="展开阅读">
        <span class="control-icon" aria-hidden="true">□</span><span class="control-label">展开阅读</span>
      </button>
      <button class="control-chip" id="copyChip" type="button" style="display: none;" title="复制" aria-label="复制回复">
        <span class="control-icon" aria-hidden="true">⧉</span><span class="control-label">复制</span>
      </button>
    </div>
    <div class="input-row" id="inputRow" style="display: none;">
      <input type="text" id="chatInput" placeholder="说点什么..." autocomplete="off" />
      <button id="chatSend" title="发送" aria-label="发送消息">发送</button>
    </div>
    <!-- 调整大小手柄（hover 渐显，右下角） -->
    <div class="resize-grip" id="resizeGrip"></div>
    <!-- 三角箭头（DOM 元素，跟随气泡方向） -->
    <div class="bubble-arrow"></div>
  </div>
  <script src="/js/vendor/marked.min.js"></script>
  <script src="/js/bubble.js"></script>
</body>
</html>
