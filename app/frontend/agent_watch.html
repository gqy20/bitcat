<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Watch</title>
  <link rel="stylesheet" href="/css/agent_watch.css" />
</head>
<body>
  <main id="agent-watch" class="watch-shell">
    <header class="watch-header" id="watch-header" role="button" tabindex="0" title="折叠 / 展开任务栈">
      <span class="watch-dot" aria-hidden="true"></span>
      <span id="watch-title" class="watch-title">Claude Code</span>
      <span id="watch-count" class="watch-count">0</span>
    </header>
    <section id="stack" class="task-stack" aria-live="polite"></section>
  </main>
  <script src="/js/agent_watch.js"></script>
</body>
</html>
