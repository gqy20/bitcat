<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BitCat Game Dev Harness</title>
  <link rel="stylesheet" href="css/game.css" />
  <style>
    .devbar {
      position: fixed;
      z-index: 50;
      right: 4px;
      top: 112px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      width: 46px;
      min-height: 46px;
      overflow: hidden;
      color: #f7fbff;
      background: rgba(9, 13, 18, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      font: 700 12px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
      transition: width 140ms ease, background-color 140ms ease;
    }

    .devbar::before {
      content: "Dev";
      flex: 0 0 auto;
    }

    .devbar:hover,
    .devbar:focus-within {
      width: min(720px, calc(100vw - 28px));
      background: rgba(9, 13, 18, 0.90);
    }

    @media (max-height: 680px) {
      .devbar {
        top: auto;
        bottom: 14px;
      }
    }

    .devbar label,
    .devbar input,
    .devbar select,
    .devbar button {
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .devbar:hover label,
    .devbar:hover input,
    .devbar:hover select,
    .devbar:hover button,
    .devbar:focus-within label,
    .devbar:focus-within input,
    .devbar:focus-within select,
    .devbar:focus-within button {
      opacity: 1;
      pointer-events: auto;
    }

    .devbar select,
    .devbar input,
    .devbar button {
      height: 30px;
      color: #f7fbff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      font: inherit;
    }

    .devbar input {
      width: 188px;
      padding: 0 9px;
    }

    .devbar select {
      min-width: 148px;
      padding: 0 8px;
    }

    .devbar button {
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud" class="hud">
    <div id="title" class="title">Mini Game</div>
    <div class="stats">
      <span id="score">0</span>
      <span id="length">0</span>
    </div>
  </div>
  <div id="overlay" class="overlay hidden">
    <div id="overlayTitle" class="overlay-title"></div>
    <div id="overlayText" class="overlay-text"></div>
    <div id="overlayActions" class="overlay-actions hidden">
      <button id="restartBtn" type="button">再来一次</button>
      <button id="quitBtn" type="button">退出</button>
    </div>
  </div>
  <div class="devbar">
    <label for="devGameSelect">Game</label>
    <select id="devGameSelect"></select>
    <label for="devTopicInput">Topic</label>
    <input id="devTopicInput" type="text" value="Rust 编程词汇" />
    <button id="devGenerateBtn" type="button">Generate</button>
    <button id="devRestartBtn" type="button">Restart</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "./js/vendor/three/three.module.js"
      }
    }
  </script>
  <script src="js/game_dev.js?dev=3"></script>
  <script src="js/games/snake.js?dev=3"></script>
  <script src="js/games/gomoku.js?dev=3"></script>
  <script src="js/games/beads.js?dev=3"></script>
  <script type="module" src="js/games/arena.js?dev=3"></script>
  <script src="js/game_engine.js?dev=3"></script>
</body>
</html>
