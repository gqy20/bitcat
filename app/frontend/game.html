<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BitCat Game</title>
  <link rel="stylesheet" href="/css/game.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud" class="hud">
    <div id="title" class="title">Mini Game</div>
    <div class="stats">
      <span id="score">0</span>
      <span id="length">0</span>
    </div>
  </div>
  <div id="overlay" class="overlay hidden">
    <div id="overlayTitle" class="overlay-title"></div>
    <div id="overlayText" class="overlay-text"></div>
    <div id="overlayActions" class="overlay-actions hidden">
      <button id="restartBtn" type="button">再来一次</button>
      <button id="quitBtn" type="button">退出</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "/js/vendor/three/three.module.js"
      }
    }
  </script>
  <script src="/js/games/snake.js"></script>
  <script src="/js/games/gomoku.js"></script>
  <script src="/js/games/beads.js"></script>
  <script type="module" src="/js/games/arena.js"></script>
  <script type="module" src="/js/game_engine.js"></script>
</body>
</html>
