<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Voice Input</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }
  .bar {
    width: 100%; height: 100%;
    background: rgba(20, 20, 30, 0.92);
    border-radius: 10px;
    border: 1px solid rgba(120, 200, 255, 0.6);
    box-shadow: 0 0 12px rgba(120, 200, 255, 0.35);
    display: flex;
    align-items: center;
    padding: 0 12px;
    box-sizing: border-box;
    gap: 10px;
  }
  .mic {
    font-size: 14px;
    color: #ff5b5b;
    animation: pulse 1.1s ease-in-out infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.85); }
  }
  textarea {
    flex: 1 1 auto;
    height: 24px;
    margin: 0; padding: 0;
    background: transparent;
    border: none; outline: none;
    color: #ffffff;
    font-size: 13px;
    line-height: 24px;
    resize: none;
    overflow: hidden;
    caret-color: #7cd0ff;
  }
  textarea::placeholder {
    color: rgba(255, 255, 255, 0.45);
  }
</style>
</head>
<body>
<div class="bar">
  <div class="mic">●</div>
  <textarea id="vox" autofocus spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="正在录音…"></textarea>
</div>
<script src="js/voice.js"></script>
</body>
</html>
