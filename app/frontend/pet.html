<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8Bit Cat</title>
  <link rel="stylesheet" href="/css/pet.css" />
</head>
<body class="state-idle">
  <div id="pet-root">
    <div id="shadow" class="shadow"></div>
    <canvas id="sprite" width="128" height="128"></canvas>
    <div id="particles" class="particles"></div>
    <!-- 吸附竖条（仅 pet-snap 窗口启用，默认 hidden） -->
    <div id="snap-bar" hidden>
      <div class="snap-layer-outer"></div>
      <div class="snap-layer-mid"></div>
      <div class="snap-core"></div>
      <div class="snap-dot"></div>
    </div>
  </div>

  <script src="/js/sprite.js"></script>
  <script src="/js/pet.js"></script>
  <script src="/js/particles.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
