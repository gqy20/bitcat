<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8Bit Cat</title>
  <link rel="stylesheet" href="/css/pet.css" />
</head>
<body class="state-idle">
  <div id="pet-root">
    <div id="shadow" class="shadow"></div>
    <canvas id="sprite" width="128" height="128"></canvas>
    <div id="particles" class="particles"></div>
  </div>

  <!-- 右键上下文菜单 -->
  <div id="ctx-menu" class="ctx-menu hidden">
    <div id="ctx-collapse" class="ctx-item">折叠</div>
    <div id="ctx-top" class="ctx-item">取消置顶</div>
    <div class="ctx-sep"></div>
    <div id="ctx-exit" class="ctx-item ctx-danger">退出</div>
  </div>

  <script src="/js/sprite.js"></script>
  <script src="/js/pet.js"></script>
  <script src="/js/particles.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
