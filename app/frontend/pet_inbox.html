<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BitCat Inbox</title>
  <link rel="stylesheet" href="/css/pet_inbox.css" />
</head>
<body>
  <main class="inbox-shell">
    <header class="inbox-head">
      <span id="inbox-title">待查看</span>
      <div class="inbox-head-actions">
        <button class="inbox-head-action" type="button" data-action="observe-now">立即观察</button>
        <button class="inbox-head-action" type="button" data-action="clear-screenshots">清除计数</button>
      </div>
      <button id="inbox-close" class="icon-button" type="button" aria-label="关闭">×</button>
    </header>
    <section id="inbox-body" class="inbox-body" aria-live="polite"></section>
  </main>
  <script src="/js/pet_inbox.js"></script>
</body>
</html>
