<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8Bit Inbox</title>
  <link rel="stylesheet" href="/css/pet_inbox.css" />
</head>
<body>
  <main class="inbox-shell">

  </main>
  <script src="/js/pet_inbox.js"></script>
</body>
</html>
