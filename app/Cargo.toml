[package]
name = "ai-pad-app"
version = "0.1.4"
edition = "2021"

[dependencies]
ai-pad-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_Input", "Win32_UI_Shell", "Win32_System_Com"] }
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "local-time"] }
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
tracing-appender = "0.2.5"
ctrlc = "3"
toml_edit = "0.22"

[features]
default = []
ipc-tests = ["tauri/test"]

[lib]
name = "ai_pad_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
