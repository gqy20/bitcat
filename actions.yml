# 8BitDo Micro 个性化配置
# 按键动作绑定、启动参数等

defaults:
  terminal: powershell
  window: maximized   # maximized / normal / minimized

actions:
  Start:
    type: launch
    program: claude
    args: "--dangerously-skip-permissions"
    workdir: "D:\\C\\Desktop\\ai"
    terminal: true

  Y:
    type: voice
    program: claude
    workdir: "D:\\C\\Desktop\\ai\\research"
    terminal: true
    voice:
      trigger: ["ctrl", "win"]   # 触发系统语音输入法的快捷键
      delay: 1.0                  # 启动终端后等待时间（秒）
