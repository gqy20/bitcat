# 8BitDo Micro 个性化配置
# 按键动作绑定、启动参数等

defaults:
  terminal: powershell
  window: maximized   # maximized / normal / minimized

actions:
  Start:
    type: launch
    program: claude
    args: "--dangerously-skip-permissions"
    workdir: "D:\\C\\Desktop\\ai"
    terminal: true

